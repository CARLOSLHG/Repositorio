<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00cc66"/>
      <stop offset="100%" stop-color="#009944"/>
    </linearGradient>
    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ccffdd"/>
    </linearGradient>
  </defs>
  <!-- Outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#glow)"/>
  <!-- Box body -->
  <rect x="12" y="14" width="40" height="36" rx="5" ry="5" fill="url(#boxGrad)" stroke="#00ff66" stroke-width="1.5" opacity="0.9"/>
  <!-- Box highlight line -->
  <rect x="12" y="28" width="40" height="3" fill="#00ff66" opacity="0.5"/>
  <!-- Cross (vida/health) -->
  <rect x="26" y="19" width="12" height="26" rx="2" fill="url(#crossGrad)" opacity="0.95"/>
  <rect x="19" y="26" width="26" height="12" rx="2" fill="url(#crossGrad)" opacity="0.95"/>
  <!-- +1 label -->
  <text x="50" y="14" font-family="monospace" font-size="11" font-weight="bold" fill="#00ff66" text-anchor="middle">+1</text>
</svg>
